<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메디컬 상세페이지 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root{--primary:#1E5AA8;--primary-dark:#0F3D7A;--accent:#4A83C5;--bg-soft:#E8F1FB;--text:#202938;--muted:#667085;--line:#D9E0E8;--paper:#fff;--warn:#FFF1B8}
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .topbar{height:64px;background:#fff;border-bottom:1px solid #e4e8ee;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
    .brand{font-weight:800;font-size:19px;color:var(--primary-dark)}
    .top-actions,.button-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid #cbd4df;background:#fff;border-radius:8px;padding:9px 12px;color:#293548;font-weight:650;font-size:13px}
    .btn:hover{border-color:var(--primary);color:var(--primary)}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:white}
    .btn.danger{color:#a73535}
    .btn.small{padding:6px 9px;font-size:12px}
    .app{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;max-width:1640px;margin:0 auto;padding:20px}
    .panel{background:#fff;border:1px solid #e2e7ed;border-radius:12px;box-shadow:0 3px 12px rgba(20,35,55,.04)}
    .editor{height:calc(100vh - 104px);overflow:auto;padding:16px}
    .editor h2{font-size:18px;margin:0 0 12px}
    .editor h3{font-size:14px;margin:16px 0 8px}
    .small-note{font-size:12px;color:var(--muted);line-height:1.55}
    .type-tabs,.theme-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .type-tab,.theme-tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 4px;font-size:12px;font-weight:700;color:#465267}
    .type-tab.active,.theme-tab.active{border-color:var(--primary);color:var(--primary);background:var(--bg-soft)}
    .examples{display:flex;gap:5px;margin:10px 0 16px}
    .examples .btn{flex:1;padding:7px 4px;font-size:11px}
    .field{display:flex;flex-direction:column;gap:5px;margin:9px 0}
    .field label,.field-label{font-size:12px;font-weight:700;color:#455166}
    .field input,.field textarea,.field select,.inline-input{width:100%;border:1px solid #d5dce5;border-radius:7px;padding:9px 10px;color:var(--text);background:#fff;font-size:13px}
    .field textarea{min-height:68px;resize:vertical;line-height:1.5}
    .field input:focus,.field textarea:focus,.inline-input:focus{outline:2px solid #8bb5e8;border-color:var(--primary)}
    .notice-list{display:flex;flex-direction:column;gap:6px}
    .notice-row{display:grid;grid-template-columns:1fr 1.15fr auto;gap:5px}
    .notice-row input{min-width:0;border:1px solid #d5dce5;border-radius:6px;padding:7px;font-size:12px}
    .notice-row button{border:0;background:#fff;color:#a33}
    .section-list{display:flex;flex-direction:column;gap:8px}
    .section-card{border:1px solid #e0e5eb;border-radius:9px;background:#fff}
    .section-head{display:flex;align-items:center;gap:8px;padding:9px}
    .drag{color:#9aa3b0;cursor:grab}
    .section-title{font-size:13px;font-weight:750;flex:1}
    .section-body{padding:0 10px 10px;border-top:1px solid #edf0f3}
    .section-body .field{margin:8px 0}
    .section-body details{margin-top:8px}
    .section-body summary{font-size:12px;color:var(--primary);cursor:pointer}
    .image-slot-input{font-size:12px!important;padding:7px!important}
    .checkline{display:flex;gap:7px;align-items:center;font-size:12px;margin:8px 0}
    .preview-area{min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
    .preview-toolbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px}
    .preview-stage{width:100%;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
    .preview-scale{transform-origin:top center}
    #detail{width:860px;background:#fff;overflow:hidden;color:var(--text);position:relative}
    #detail.frame-medical{border:10px solid var(--primary)}
    #detail.frame-minimal{border:2px solid #d8dee7}
    #detail.frame-rounded{border:12px solid var(--bg-soft);border-radius:30px}
    #detail.frame-premium{border:12px double var(--accent)}
    #detail.frame-corner{border:6px solid var(--primary);outline:1px solid var(--accent);outline-offset:-16px}
    .frame-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 18px}
    .frame-option{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #d9e0e8;background:#fff;border-radius:9px;text-align:left;color:var(--text)}
    .frame-option.active{border:2px solid var(--primary);background:var(--bg-soft);padding:7px}
    .frame-preview{width:48px;height:60px;flex:none;background:#fff;position:relative;border:1px solid #eee}
    .frame-preview:after{content:"";position:absolute;inset:10px 6px;background:linear-gradient(#e9edf2 0 0) 0 0/100% 3px no-repeat,linear-gradient(#f0f2f5 0 0) 0 8px/100% 2px no-repeat,linear-gradient(#f0f2f5 0 0) 0 15px/100% 20px no-repeat}
    .frame-preview.medical{border:5px solid var(--primary)}
    .frame-preview.minimal{border:1px solid #b9c3cf}
    .frame-preview.rounded{border:5px solid var(--bg-soft);border-radius:11px}
    .frame-preview.premium{border:5px double var(--accent)}
    .frame-preview.corner{border:3px solid var(--primary);outline:1px solid var(--accent);outline-offset:-8px}
    .frame-option strong{display:block;font-size:12px}
    .frame-option small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .detail-section{padding:105px 50px;position:relative;background:#fff}
    .detail-section:nth-child(even){background:var(--bg-soft)}
    .detail-section.dark{background:var(--primary-dark);color:#fff}
    .detail-section h2{font-size:34px;line-height:1.35;letter-spacing:-.7px;margin:0 0 20px;font-weight:750}
    .detail-section h3{font-size:25px;line-height:1.4;margin:0 0 13px}
    .detail-section p,.detail-section li{font-size:20px;line-height:1.65;margin:0 0 12px}
    .detail-section .eyebrow{font-size:16px;letter-spacing:2px;font-weight:800;color:var(--primary-ink);margin-bottom:13px}
    .detail-section.dark .eyebrow{color:#fff}
    .accent{color:var(--primary-ink)}
    .dark .accent{color:#f3d9a8}
    .hero{background:linear-gradient(180deg,var(--bg-soft),#fff)!important;text-align:center;padding-top:68px;padding-bottom:72px}
    .hero-en{font-size:17px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:12px}
    .hero h1{font-size:46px;line-height:1.25;margin:0 auto 15px;max-width:740px}
    .hero-copy{font-size:23px!important;max-width:710px;margin:0 auto 20px!important}
    .badge-line{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px 0 24px}
    .pill{display:inline-flex;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid #d4dfeb;font-size:16px;font-weight:650}
    .badge-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:28px}
    .icon-badge{width:112px;min-height:112px;border-radius:50%;background:#fff;border:1px solid #dce5ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:9px;text-align:center;font-size:15px;font-weight:700}
    .icon-badge svg{width:30px;height:30px;stroke:var(--primary-ink);fill:none;stroke-width:1.8}
    .photo{display:block;width:100%;object-fit:cover;border-radius:16px;background:#fff}
    .photo.hero-photo{width:100%;height:380px;object-fit:contain;mix-blend-mode:multiply}
    .empty-photo{height:210px;border:2px dashed #b9c9dc;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#718096;font-size:18px;background:rgba(255,255,255,.55)}
    #detail.exporting .empty-photo{display:none!important}
    .cards{display:grid;gap:18px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .content-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
    .content-card .photo,.content-card .empty-photo{border-radius:0;height:210px}
    .card-copy{padding:18px}
    .card-copy h3{font-size:22px;margin-bottom:8px}
    .card-copy p{font-size:18px;margin:0}
    .solution-line{font-size:36px!important;font-weight:750;line-height:1.4!important;margin-bottom:16px!important}
    .point{margin:22px 0 30px}
    .point-label{display:inline-block;background:var(--primary);color:var(--primary-contrast);border-radius:99px;padding:8px 14px;font-size:16px;font-weight:800;margin-bottom:12px}
    .point h3{font-size:27px}
    .point-layout-B{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
    .point-layout-C{position:relative}
    .point-layout-C .photo,.point-layout-C .empty-photo{height:330px}
    .before-after{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .before-after .photo,.before-after .empty-photo{height:210px}
    .before-after-label{font-size:16px;font-weight:800;color:var(--primary-ink);margin-bottom:6px}
    .use-icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
    .use-icon{min-height:120px;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
    .use-icon svg{width:34px;height:34px;stroke:var(--primary-ink);fill:none;stroke-width:1.8}
    .use-icon strong{display:block;font-size:16px;margin:9px 0 0}
    .overlay-copy{position:absolute;left:22px;right:22px;bottom:18px;background:#fff;border-radius:14px;padding:18px}
    .compare,.spec-table,.size-table{width:100%;border-collapse:collapse;font-size:18px;background:#fff}
    .compare th,.compare td,.spec-table th,.spec-table td,.size-table th,.size-table td{border:1px solid #d6dbe2;padding:13px 12px;text-align:left;vertical-align:top}
    .compare th:last-child{background:var(--primary);color:var(--primary-contrast)}
    .spec-table th{width:31%;background:#f1f3f5;font-weight:700}
    .spec-table td{background:#fff}
    .step{position:relative;text-align:center}
    .step-number{font-size:17px;color:var(--primary);font-weight:800;margin:0 0 8px}
    .step .photo,.step .empty-photo{height:160px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .step h3{font-size:21px;margin:12px 0 8px}
    .step p{font-size:18px}
    .size-photo-wrap{position:relative}
    .measure{position:absolute;background:var(--primary);color:#fff;padding:6px 9px;border-radius:6px;font-size:16px;font-weight:700}
    .measure.horizontal{top:12px;left:50%;transform:translateX(-50%)}
    .measure.vertical{right:12px;top:50%;transform:translateY(-50%)}
    .summary-bar{margin:16px 0;padding:16px;border-radius:10px;background:var(--primary);color:var(--primary-contrast);font-size:21px;font-weight:750;text-align:center}
    .recommend-list,.caution-list{list-style:none;padding:0;margin:0}
    .recommend-list li{padding:13px 0;border-bottom:1px solid #dce3eb}
    .recommend-list li:before{content:"✓";color:var(--primary-ink);font-weight:900;margin-right:12px}
    .caution-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .caution-box{background:#fff;border-radius:14px;padding:20px}
    .ai-disclaimer{font-size:16px!important;margin-top:12px!important;color:var(--muted)}
    .seller-line{font-size:16px!important;color:var(--muted);margin:18px 0 0!important}
    .bottom-notice{margin:30px -50px -105px;padding:22px 40px;background:var(--primary-dark);color:#fff;text-align:center;font-size:19px;font-weight:700}
    .warning-word{ text-decoration:underline wavy #d19b00 2px;text-decoration-skip-ink:none;cursor:help;position:relative}
    .warning-word:hover:after{content:attr(data-tip);position:absolute;left:0;bottom:100%;width:260px;padding:9px;background:#2c3440;color:#fff;border-radius:7px;font-size:14px;z-index:5}
    .mobile-tabs{display:none}
    .seller-dock{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e0e8;padding:9px 18px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:20}
    .seller-dock strong{font-size:12px}
    .seller-dock input{width:180px;border:1px solid #d5dce5;border-radius:6px;padding:7px;font-size:12px}
    .status{font-size:12px;color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
    .modal{background:#fff;border-radius:14px;padding:22px;width:min(560px,100%);max-height:85vh;overflow:auto}
    .modal h2{margin:0 0 12px;font-size:20px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .warning-item{padding:9px;border-bottom:1px solid #eee;font-size:14px}
    .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
    .theme-chip{height:9px;border-radius:99px;margin:4px 0}
    .hidden{display:none!important}
    @media(max-width:900px){
      .app{display:block;padding:10px 10px 90px}
      .editor,.preview-area{display:none}
      .editor.mobile-active,.preview-area.mobile-active{display:flex}
      .editor.mobile-active{height:auto;max-height:none;overflow:visible;display:block}
      .mobile-tabs{display:flex;position:sticky;top:64px;background:#fff;padding:8px;z-index:8;gap:8px}
      .mobile-tabs button{flex:1}
      .topbar{padding:0 12px}
      .top-actions .desktop-only{display:none}
      .preview-area.mobile-active{overflow:hidden}
      .preview-stage{justify-content:flex-start;overflow:hidden}
      .seller-dock{flex-wrap:wrap}
      .seller-dock input{width:140px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">메디컬 상세페이지 메이커</div>
    <div class="top-actions">
      <button class="btn desktop-only" id="undoBtn">실행 취소</button>
      <button class="btn desktop-only" id="redoBtn">다시 실행</button>
      <button class="btn desktop-only" id="saveJsonBtn">프로젝트 저장</button>
      <button class="btn desktop-only" id="loadJsonBtn">프로젝트 불러오기</button>
      <button class="btn primary" id="exportJpg">JPG 다운로드</button>
      <button class="btn" id="exportPng">PNG 다운로드</button>
      <button class="btn desktop-only" id="copyHtml">HTML 복사</button>
      <input id="projectFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="mobile-tabs">
    <button class="btn primary" data-tab="editor">입력하기</button>
    <button class="btn" data-tab="preview-area">미리보기</button>
  </nav>
  <main class="app">
    <aside class="panel editor mobile-active" id="editor">
      <h2>상세페이지 프레임</h2>
      <p class="small-note">프레임을 선택하면 미리보기와 다운로드 결과에 적용됩니다.</p>
      <div class="frame-options" id="frameOptions"></div>
      <h2>제품 상세 정보</h2>
      <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" data-type="medical">의료기기</button>
        <button class="type-tab" data-type="quasi">의약외품</button>
        <button class="type-tab" data-type="general">일반 건강용품</button>
      </div>
      <div class="examples">
        <button class="btn" data-example="spatula">멸균 목설압자</button>
        <button class="btn" data-example="bandage">하이드로콜로이드 밴드</button>
        <button class="btn" data-example="castshoe">캐스트슈즈</button>
      </div>
      <div class="field"><label for="productName">제품명</label><input id="productName" data-bind="productName" placeholder="예: 멸균 목설압자"></div>
      <div class="field"><label for="productEn">영문 제품명</label><input id="productEn" data-bind="productEn" placeholder="예: Sterile Tongue Depressor"></div>
      <div class="field"><label for="mainCopy">한 줄 카피</label><input id="mainCopy" data-bind="mainCopy" placeholder="제품의 핵심 특징을 간결하게 입력"></div>
      <div class="field"><label for="specs">사양 배지 (·로 구분)</label><input id="specs" data-bind="specs" placeholder="150×18mm · 50개입 · 개별포장"></div>
      <div class="field"><label for="features">핵심 특징 (최대 3줄, AI 작성용)</label><textarea id="features" data-bind="features" placeholder="확인된 제품 특징을 입력하세요"></textarea></div>
      <p class="small-note" id="medicalAdNote">의료기기 효능 표현은 허가받은 사용목적 범위에서만 작성해 주세요.</p>
      <div class="field"><label for="target">타깃 고객</label><input id="target" data-bind="target" placeholder="예: 의료기관, 가정 사용자"></div>
      <div class="field"><label>대표 사진</label><input class="image-slot-input" type="file" accept="image/*" data-image="hero"></div>
      <div class="field"><label>핵심 아이콘 배지 (최대 4개)</label><div id="iconPickers"></div></div>
      <h3>제품정보 고시표 <span class="small-note">유형별 기본 항목 · 자유 편집</span></h3>
      <div class="notice-list" id="noticeList"></div>
      <button class="btn small" id="addNotice">+ 항목 추가</button>
      <h3>디자인 테마</h3>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="field hidden" id="customColorWrap"><label for="customColor">주색 선택</label><input id="customColor" type="color" value="#1E5AA8"></div>
      <div class="field"><label class="checkline"><input type="checkbox" data-bind="highRes"> 고해상도 다운로드 (1720px 폭)</label></div>
      <div class="field"><label class="checkline"><input type="checkbox" data-bind="splitExport"> 섹션 경계 기준 3,000px 이하 분할 다운로드</label></div>
      <div class="field"><label class="checkline"><input type="checkbox" data-bind="showAiDisclaimer"> 선택한 섹션에 AI 이미지 안내 표시</label></div>
      <details>
        <summary>AI 문구 작성 설정</summary>
        <div class="field"><label for="apiKey">Anthropic API 키</label><input id="apiKey" type="password" data-bind="apiKey" autocomplete="off" placeholder="브라우저에만 저장됩니다"></div>
        <div class="field"><label for="aiModel">모델명</label><input id="aiModel" data-bind="aiModel" placeholder="claude-sonnet-5-5"></div>
        <button class="btn small" id="writeAllAi">한 번에 전체 작성</button>
        <p class="small-note">API 키는 이 브라우저의 localStorage에 저장됩니다. 공유 컴퓨터에서는 저장을 권장하지 않습니다.</p>
      </details>
      <h3>섹션 빌더 <span class="small-note">끌어서 순서 변경</span></h3>
      <div class="section-list" id="sectionList"></div>
    </aside>
    <section class="preview-area" id="preview-area">
      <div class="panel preview-toolbar">
        <strong>실시간 미리보기</strong>
        <div class="top-actions">
          <label class="small-note"><input type="checkbox" id="previewWarnings" checked> 광고 표현 표시</label>
          <button class="btn small" id="checkAds">광고 표현 점검</button>
        </div>
      </div>
      <div class="preview-stage" id="previewStage">
        <div class="preview-scale" id="previewScale">
          <article id="detail"></article>
        </div>
      </div>
    </section>
  </main>
  <div class="seller-dock">
    <strong>판매자 기본정보</strong>
    <label class="small-note" for="sellerName">판매원</label><input id="sellerName" placeholder="회사명">
    <label class="small-note" for="sellerPhone">고객센터</label><input id="sellerPhone" placeholder="전화번호">
    <span class="status" id="saveStatus">자동 저장됨</span>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modalTitle">안내</h2><div id="modalContent"></div>
      <div class="modal-actions"><button class="btn" id="modalCancel">닫기</button><button class="btn primary" id="modalContinue">확인하고 진행</button></div>
    </div>
  </div>
  <script>
  (() => {
    "use strict";
    const STORAGE_KEY = "medical-detail-maker-v1";
    const types = {
      medical:{label:"의료기기",notice:"본 제품은 의료기기이며, 사용 전 사용방법과 주의사항을 확인하십시오.",fields:["품목명","모델명","품목허가(신고)번호","등급","사용목적","사용방법","포장단위","멸균여부/방법","제조원","수입원","판매원","제조국","고객센터","사용기한","광고심의필번호"]},
      quasi:{label:"의약외품",notice:"본 제품은 의약외품입니다. 사용 전 제품 표시사항과 사용상 주의사항을 확인하십시오.",fields:["제품명","전성분","규격","효능·효과","용법·용량","저장방법","제조원","제조국","사용상 주의사항"]},
      general:{label:"일반 건강용품",notice:"본 제품은 의료기기가 아니며, 질병의 예방 및 치료를 위한 제품이 아닙니다.",fields:["제품명","소재","색상","사이즈","구성","제조국","제조자/수입자","KC인증(해당 시)"]}
    };

    const themes=[

      {id:"navy",name:"프리미엄 네이비",primary:"#1B2A4A",dark:"#111C33",accent:"#B8925A",soft:"#F6F1EA"},
      {id:"mint",name:"클린 민트",primary:"#0F9D8A",dark:"#087568",accent:"#45B8A7",soft:"#E7F7F4"},
      {id:"burgundy",name:"웜 버건디",primary:"#7A1E24",dark:"#52151A",accent:"#B65C5E",soft:"#F4ECE6"},
      {id:"custom",name:"커스텀",primary:"#1E5AA8",dark:"#0F3D7A",accent:"#4A83C5",soft:"#E8F1FB"}

      {id:"rounded",name:"소프트 라운드",description:"부드러운 모서리",preview:"rounded"},

    const baseSections=[

      {id:"empathy",title:"02 공감",enabled:true,cards:[{title:"사용할 때 번거로움",desc:"준비와 정리가 번거로운 순간이 있습니다."},{title:"안심할 수 있는 선택",desc:"제품 정보를 꼼꼼히 확인하고 싶습니다."}],ai:false},
      {id:"solution",title:"03 해결 선언",enabled:true,titleText:"필요한 순간을 위해, 꼼꼼하게 준비했습니다.",desc:"제품의 특징과 사용 정보를 확인하고 편리하게 선택하세요.",image:"",arrow:""},
      {id:"points",title:"04 POINT 특장점",enabled:true,items:[{headline:"필요한 정보만 담아\\n간편하게 확인",desc:"제품 표시사항과 구성 정보를 확인해 보세요.",image:"",layout:"A"}]},
      {id:"compare",title:"05 비교표",enabled:false,rows:[{label:"제품 정보",other:"기본 정보 제공",ours:"제품 정보 확인 가능"},{label:"포장 구성",other:"제품별 상이",ours:"상세페이지에서 안내"}]},
      {id:"use",title:"06 사용 부위·사용처",enabled:true,layout:"grid2",cards:[{title:"의료기관",desc:"제품 표시사항에 맞게 사용"},{title:"가정",desc:"사용 전 안내를 확인"}]},
      {id:"steps",title:"07 사용 방법",enabled:true,items:[{title:"사용 전 확인",desc:"포장과 제품 상태를 확인합니다.",image:""},{title:"사용 준비",desc:"제품 안내에 따라 준비합니다.",image:""},{title:"사용 후 정리",desc:"사용 후 주의사항을 확인합니다.",image:""}]},
      {id:"size",title:"08 구성품·사이즈",enabled:true,summary:"제품 구성과 규격은 상품 정보를 확인해 주세요.",image:"",width:"",height:"",sizeRows:[["항목","규격"],["제품 크기",""],["포장 단위",""]]},
      {id:"recommend",title:"09 이런 분께 추천합니다",enabled:true,items:["제품의 규격과 구성을 미리 확인하고 싶은 분","사용 목적에 맞는 제품을 찾는 분","제품 정보를 꼼꼼히 비교하고 싶은 분"]},
      {id:"caution",title:"10 사용 전 주의사항",enabled:true,items:["사용 전 제품 표시사항과 사용방법을 확인하십시오.","포장이 손상된 경우 사용하지 마십시오.","이상 발생 시 사용을 중단하고 전문가와 상담하십시오."],twoColumn:false},
      {id:"notice",title:"11 제품정보 고시표",enabled:true}
    ];
    let state = defaultState();
    let history=[], redo=[], editSnapshotDone=false, editTimer;
    let dragId=null, pendingAction=null;
    const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
    function defaultState(){
      const noticeValues={};
      types.medical.fields.forEach(k=>noticeValues[k]="");
      return {type:"medical",frame:"medical",theme:"blue",customColor:"#1E5AA8",productName:"",productEn:"",mainCopy:"",specs:"",features:"",target:"",apiKey:"",aiModel:"claude-sonnet-5-5",highRes:false,splitExport:false,showAiDisclaimer:false,sellerName:"",sellerPhone:"",noticeValues,noticeFields:[...types.medical.fields],sections:structuredClone(baseSections)};
    }
    function clone(v){return JSON.parse(JSON.stringify(v))}
    function snapshot(){history.push(clone(state));if(history.length>40)history.shift();redo=[]}
    function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function safeText(s){return esc(s).replace(/\n/g,"<br>")}
    function setTheme(){
      let t=themes.find(x=>x.id===state.theme)||themes[0];
      if(state.theme==="custom"){t=customPalette(state.customColor)}
      const root=document.documentElement;
      [["primary",t.primary],["primary-dark",t.dark],["accent",t.accent],["bg-soft",t.soft]].forEach(([k,v])=>root.style.setProperty("--"+k,v));
      const whiteContrast=contrast(t.primary,"#fff");
      const light=whiteContrast>=4.5?"#fff":"#18212f";
      let ink=t.primary;
      if(contrast(ink,"#fff")<4.5){let [r,g,b]=hexRgb(ink);while(contrast(ink,"#fff")<4.5){r*=.92;g*=.92;b*=.92;ink=rgbHex([r,g,b])}}
      root.style.setProperty("--text","#202938");
      root.style.setProperty("--primary-contrast",light);
      root.style.setProperty("--primary-ink",ink);
    }
    function hexRgb(hex){const h=hex.replace("#","");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
    function rgbHex(a){return "#"+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("")}
    function customPalette(color){
      const [r,g,b]=hexRgb(color);const mix=(target,p)=>rgbHex([r+(target[0]-r)*p,g+(target[1]-g)*p,b+(target[2]-b)*p]);
      let dark=mix([0,0,0],.65);
      while(contrast(dark,"#fff")<4.5)dark=mix([0,0,0],.75);
      return {primary:color,dark,accent:mix([255,255,255],.24),soft:mix([255,255,255],.91)}
    }
    function contrast(a,b){const lum=x=>{let c=hexRgb(x).map(v=>v/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};let x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
    function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$("#saveStatus").textContent="자동 저장됨"}catch(e){$("#saveStatus").textContent="저장 공간 부족";console.error("자동 저장 실패",e)}}
    function loadLocal(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);state={...defaultState(),...parsed};state.sections=parsed.sections||clone(baseSections);}}catch(e){console.error("저장된 프로젝트를 불러오지 못했습니다.",e)}}
    function section(id){return state.sections.find(s=>s.id===id)}
    function updateType(type){
      if(state.type!==type)snapshot();
      const old=state.noticeValues||{};
      state.type=type;
      state.noticeFields=types[type].fields.map(k=>k);
      state.noticeValues={...old};
      types[type].fields.forEach(k=>{if(!(k in state.noticeValues))state.noticeValues[k]=""});
      if(type==="medical"&&state.sellerName)state.noticeValues["판매원"]=state.sellerName;
      if(type==="medical"&&state.sellerPhone)state.noticeValues["고객센터"]=state.sellerPhone;
      renderAll();
    }
    function syncBindings(){
      $$("[data-bind]").forEach(el=>{
        const key=el.dataset.bind;
        if(el.type==="checkbox")el.checked=!!state[key];else el.value=state[key]||"";
      });
      $("#sellerName").value=state.sellerName||"";$("#sellerPhone").value=state.sellerPhone||"";
      $$(".type-tab").forEach(b=>b.classList.toggle("active",b.dataset.type===state.type));
      $$(".theme-tab").forEach(b=>b.classList.toggle("active",b.dataset.theme===state.theme));
      $("#customColorWrap").classList.toggle("hidden",state.theme!=="custom");
      $("#customColor").value=state.customColor||"#1E5AA8";
    }
    function renderThemes(){
      $("#themeGrid").innerHTML=themes.map(t=>`<button class="theme-tab ${state.theme===t.id?"active":""}" data-theme="${t.id}">${t.name}<span class="theme-chip" style="background:${t.id==="custom"?state.customColor:t.primary}"></span></button>`).join("");
      $$(".theme-tab").forEach(b=>b.onclick=()=>{snapshot();state.theme=b.dataset.theme;setTheme();renderAll()});
    }
    function renderFrameOptions(){
      $("#frameOptions").innerHTML=frames.map(frame=>`<button type="button" class="frame-option ${state.frame===frame.id?"active":""}" data-frame="${frame.id}" aria-pressed="${state.frame===frame.id}"><span class="frame-preview ${frame.preview}"></span><span><strong>${frame.name}</strong><small>${frame.description}</small></span></button>`).join("");
      $$("[data-frame]").forEach(button=>button.onclick=()=>{if(state.frame===button.dataset.frame)return;snapshot();state.frame=button.dataset.frame;renderAll()});
    }
    function renderNotices(){
      $("#noticeList").innerHTML=(state.noticeFields||[]).map((field,i)=>`<div class="notice-row" draggable="true" data-notice="${i}"><input aria-label="항목명" value="${esc(field)}" data-notice-label="${i}"><input aria-label="${esc(field)} 값" placeholder="내용 입력" value="${esc(state.noticeValues[field]||"")}" data-notice-value="${i}"><button title="위로" data-move="${i}">↕</button><button title="삭제" data-delete="${i}">×</button></div>`).join("");
      $$("[data-notice-label]").forEach(el=>el.onchange=()=>{snapshot();let i=+el.dataset.noticeLabel,old=state.noticeFields[i],v=state.noticeValues[old]||"";state.noticeFields[i]=el.value;delete state.noticeValues[old];state.noticeValues[el.value]=v;renderAll()});
      $$("[data-notice-value]").forEach(el=>el.oninput=()=>{recordEdit();let key=state.noticeFields[+el.dataset.noticeValue];state.noticeValues[key]=el.value;changed(false)});
      $$("[data-delete]").forEach(el=>el.onclick=()=>{snapshot();let i=+el.dataset.delete;state.noticeFields.splice(i,1);renderAll()});
      $$("[data-move]").forEach(el=>el.onclick=()=>{snapshot();let i=+el.dataset.move;if(i>0)[state.noticeFields[i-1],state.noticeFields[i]]=[state.noticeFields[i],state.noticeFields[i-1]];renderAll()});
      $$(".notice-row").forEach(row=>{row.ondragstart=()=>dragId="notice:"+row.dataset.notice;row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();if(!dragId?.startsWith("notice:"))return;snapshot();let from=+dragId.split(":")[1],to=+row.dataset.notice;let [m]=state.noticeFields.splice(from,1);state.noticeFields.splice(to,0,m);renderAll()}});
    }
    function renderIcons(){
      const sec=section("hero");
      $("#iconPickers").innerHTML=[0,1,2,3].map((_,i)=>`<select class="inline-input icon-select" data-icon="${i}"><option value="">선택 안 함</option>${iconNames.map(n=>`<option ${sec.iconLabels[i]===n?"selected":""}>${n}</option>`).join("")}</select>`).join("");
      $$(".icon-select").forEach(el=>el.onchange=()=>{snapshot();sec.iconLabels[+el.dataset.icon]=el.value;renderPreview();saveLocal()});
    }
    const fieldDef={
      hero:`<div class="field"><label>히어로 카피</label><input data-sec="hero" data-key="copy" placeholder="한 줄 카피"></div><button class="btn small ai-one" data-ai-section="hero">✨ AI 문구 작성</button>`,
      empathy:`<div class="repeat-editor" data-repeat="empathy"></div><button class="btn small" data-add="empathy">+ 상황 카드</button><button class="btn small ai-one" data-ai-section="empathy">✨ AI 문구 작성</button>`,
      solution:`<div class="field"><label>해결 선언 문장</label><textarea data-sec="solution" data-key="titleText"></textarea></div><div class="field"><label>보조 설명</label><textarea data-sec="solution" data-key="desc"></textarea></div><div class="field"><label>화살표 라벨 (선택)</label><input data-sec="solution" data-key="arrow"></div><input class="image-slot-input" type="file" accept="image/*" data-image="solution">`,
      points:`<div class="repeat-editor" data-repeat="points"></div><button class="btn small" data-add="points">+ 특장점 (최대 8개)</button><button class="btn small ai-one" data-ai-section="points">✨ AI 문구 작성</button>`,
      compare:`<div class="repeat-editor" data-repeat="compare"></div><button class="btn small" data-add="compare">+ 비교 항목</button>`,
      use:`<div class="field"><label>레이아웃</label><select data-sec="use" data-key="layout"><option value="grid2">2열 카드</option><option value="grid3">3열 카드</option><option value="icons">아이콘 6칸 가로줄</option></select></div><div class="repeat-editor" data-repeat="use"></div><button class="btn small" data-add="use">+ 사용처 카드</button>`,
      steps:`<div class="repeat-editor" data-repeat="steps"></div><button class="btn small" data-add="steps">+ 단계 (최대 6개)</button><button class="btn small ai-one" data-ai-section="steps">✨ AI 문구 작성</button>`,
      size:`<div class="field"><label>구성 요약</label><input data-sec="size" data-key="summary"></div><div class="field"><label>가로 치수</label><input data-sec="size" data-key="width"></div><div class="field"><label>세로 치수</label><input data-sec="size" data-key="height"></div><div class="repeat-editor" data-repeat="sizeRows"></div><button class="btn small" data-add="sizeRows">+ 사이즈표 행</button><button class="btn small" id="addSizeColumn">+ 사이즈표 열</button><input class="image-slot-input" type="file" accept="image/*" data-image="size">`,
      recommend:`<div class="repeat-editor" data-repeat="recommend"></div><button class="btn small" data-add="recommend">+ 추천 대상 (최대 6개)</button><button class="btn small ai-one" data-ai-section="recommend">✨ AI 문구 작성</button>`,
      caution:`<label class="checkline"><input type="checkbox" data-sec="caution" data-key="twoColumn"> 사용 방법과 주의사항을 좌우 2단으로 표시</label><div class="repeat-editor" data-repeat="caution"></div><button class="btn small" data-add="caution">+ 주의사항</button><button class="btn small ai-one" data-ai-section="caution">✨ AI 문구 작성</button>`,
      notice:`<p class="small-note">정보 고시 항목은 위에서 편집합니다. 판매원·고객센터는 하단 판매자 정보와 연동됩니다.</p>`
    };
    function renderSectionEditors(){
      const aiSections=["hero","empathy","points","steps","recommend","caution"];
      $("#sectionList").innerHTML=state.sections.map(s=>`<div class="section-card" draggable="true" data-section="${s.id}"><div class="section-head"><span class="drag">⠿</span><input type="checkbox" data-enabled="${s.id}" ${s.enabled?"checked":""}><span class="section-title">${s.title}</span>${aiSections.includes(s.id)?`<button class="btn small ai-one" data-ai-section="${s.id}">✨ AI</button>`:""}</div><div class="section-body">${fieldDef[s.id]||""}<label class="checkline"><input type="checkbox" data-ai="${s.id}" ${s.ai?"checked":""}> 이 섹션에 AI 생성 이미지 안내 표시</label>${s.id!=="notice"?`<details><summary>이미지 슬롯</summary>${imageInputs(s)}</details>`:""}</div></div>`).join("");
      $$(".section-card").forEach(card=>{card.ondragstart=e=>{dragId=card.dataset.section;e.dataTransfer.effectAllowed="move"};card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();const to=card.dataset.section;if(!dragId||dragId===to)return;snapshot();let a=state.sections.findIndex(x=>x.id===dragId),b=state.sections.findIndex(x=>x.id===to);const [m]=state.sections.splice(a,1);state.sections.splice(b,0,m);dragId=null;renderAll()}});
      $$("[data-enabled]").forEach(el=>el.onchange=()=>{snapshot();section(el.dataset.enabled).enabled=el.checked;renderPreview();saveLocal()});
      $$("[data-sec]").forEach(el=>{const s=section(el.dataset.sec);el.value=s[el.dataset.key]??"";const fn=()=>{recordEdit();s[el.dataset.key]=el.type==="checkbox"?el.checked:el.value;changed(false)};el.oninput=fn;el.onchange=fn});
      $$("[data-add]").forEach(el=>el.onclick=()=>addRepeat(el.dataset.add));
      const addSizeColumn=$("#addSizeColumn");
      if(addSizeColumn)addSizeColumn.onclick=()=>{snapshot();section("size").sizeRows.forEach(row=>row.push(""));renderAll()};
      $$("[data-image]").forEach(el=>el.onchange=()=>readImage(el.dataset.image,el.files?.[0]));
      $$("[data-ai]").forEach(el=>el.onchange=()=>{section(el.dataset.ai).ai=el.checked;changed(false)});
      renderRepeatEditors();
      $$(".ai-one").forEach(el=>el.onclick=()=>writeSection(el.dataset.aiSection));
    }
    function imageInputs(s){
      const id=s.id;
      if(id==="points")return (s.items||[]).map((x,i)=>`<label class="field">POINT ${i+1} 사진<input class="image-slot-input" type="file" accept="image/*" data-image="point:${i}"></label>${x.layout==="D"?`<label class="field">POINT ${i+1} BEFORE 사진<input class="image-slot-input" type="file" accept="image/*" data-image="pointbefore:${i}"></label><label class="field">POINT ${i+1} AFTER 사진<input class="image-slot-input" type="file" accept="image/*" data-image="pointafter:${i}"></label>`:""}`).join("");
      if(id==="empathy"||id==="use")return (s.cards||[]).map((x,i)=>`<label class="field">${id==="use"?"사용처":"상황"} ${i+1} 사진<input class="image-slot-input" type="file" accept="image/*" data-image="${id}:${i}"></label>`).join("");
      if(id==="steps")return (s.items||[]).map((x,i)=>`<label class="field">STEP ${i+1} 사진<input class="image-slot-input" type="file" accept="image/*" data-image="step:${i}"></label>`).join("");
      return "";
    }
    function renderRepeatEditors(){
      $$("[data-repeat]").forEach(wrap=>{
        const key=wrap.dataset.repeat,s=key==="sizeRows"?section("size"):section(key);
        const arr=key==="sizeRows"?s.sizeRows:key==="compare"?s.rows:s.items||s.cards;

      return `<svg viewBox="0 0 24 24" aria-hidden="true">${shapes[name]||'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/>'}</svg>`;
    }
    function fitPreview(){
      const stage=$("#previewStage"),scale=$("#previewScale");
      const factor=Math.min(1,(stage.clientWidth-24)/860);
      scale.style.transform=`scale(${Math.max(.25,factor)})`;
      scale.style.height=($("#detail").offsetHeight*Math.max(.25,factor))+"px";
    }
    function renderAll(){syncBindings();renderFrameOptions();renderThemes();renderNotices();renderIcons();renderSectionEditors();renderPreview();saveLocal()}
    function recordEdit(){
      if(!editSnapshotDone){snapshot();editSnapshotDone=true}
      clearTimeout(editTimer);editTimer=setTimeout(()=>{editSnapshotDone=false},800)
    }
    function changed(){
      renderPreview();saveLocal()
    }
    function bindBase(){
      $$("[data-bind]").forEach(el=>el.addEventListener("input",()=>{
        recordEdit();
        state[el.dataset.bind]=el.type==="checkbox"?el.checked:el.value;
        if(el.dataset.bind==="productName")state.noticeValues[state.type==="medical"?"품목명":"제품명"]=el.value;
        if(el.dataset.bind==="sellerName"||el.dataset.bind==="sellerPhone"){state.sellerName=$("#sellerName").value;state.sellerPhone=$("#sellerPhone").value}
        changed()
      }));
      ["sellerName","sellerPhone"].forEach(id=>$("#"+id).oninput=()=>{recordEdit();state[id]=$("#"+id).value;if(state.type==="medical"){if(id==="sellerName")state.noticeValues["판매원"]=state[id];else state.noticeValues["고객센터"]=state[id]}changed()});
      $("#typeTabs").onclick=e=>{const b=e.target.closest("[data-type]");if(b)updateType(b.dataset.type)};
      $("#addNotice").onclick=()=>{snapshot();const name="새 항목";state.noticeFields.push(name);state.noticeValues[name]="";renderAll()};
      $("#customColor").oninput=()=>{recordEdit();state.customColor=$("#customColor").value;setTheme();renderPreview();saveLocal()};
      $("#previewWarnings").onchange=renderPreview;
      $("#checkAds").onclick=()=>showWarnings();
      $("#saveJsonBtn").onclick=saveProject;
      $("#loadJsonBtn").onclick=()=>$("#projectFile").click();
      $("#projectFile").onchange=loadProject;
      $("#undoBtn").onclick=undo;$("#redoBtn").onclick=redoAction;
      document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redoAction():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redoAction()}});
      $("#exportJpg").onclick=()=>askExport("jpeg");
      $("#exportPng").onclick=()=>askExport("png");
      $("#copyHtml").onclick=copyHTML;
      $("#modalCancel").onclick=closeModal;$("#modalContinue").onclick=()=>{const action=pendingAction;closeModal();if(action)action()};
      $$(".mobile-tabs button").forEach(b=>b.onclick=()=>{const tab=b.dataset.tab;$("#editor").classList.toggle("mobile-active",tab==="editor");$("#preview-area").classList.toggle("mobile-active",tab==="preview-area");$$(".mobile-tabs button").forEach(x=>x.classList.toggle("primary",x===b));fitPreview()});
      $$("[data-example]").forEach(b=>b.onclick=()=>loadExample(b.dataset.example));
      $("#writeAllAi").onclick=writeAllAi;
      window.addEventListener("resize",fitPreview);
    }
    function undo(){if(!history.length)return;redo.push(clone(state));state=history.pop();renderAll()}
    function redoAction(){if(!redo.length)return;history.push(clone(state));state=redo.pop();renderAll()}
    function saveProject(){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download=`${slug(state.productEn||state.productName||"medical")}_project.json`;a.click();URL.revokeObjectURL(a.href)
    }
    function loadProject(e){
      const file=e.target.files?.[0];if(!file)return;
      const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||!Array.isArray(parsed.sections)||!types[parsed.type])throw new Error("프로젝트 형식이 올바르지 않습니다.");snapshot();state={...defaultState(),...parsed};renderAll()}catch(err){alert("프로젝트를 불러오지 못했습니다: "+err.message)}e.target.value=""};
      reader.onerror=()=>alert("프로젝트 파일을 읽지 못했습니다.");reader.readAsText(file)
    }
    function slug(s){return String(s).normalize("NFKD").replace(/[^\w-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)||"detail"}
    function dateTag(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`}
    function showModal(title,content,actionLabel="확인하고 진행",action=null){
      $("#modalTitle").textContent=title;$("#modalContent").innerHTML=content;$("#modalContinue").textContent=actionLabel;pendingAction=action;$("#modalBackdrop").style.display="flex";
    }
    function closeModal(){$("#modalBackdrop").style.display="none";pendingAction=null}
    function showWarnings(action){
      const warnings=warningCount();
      const content=warnings.length?`<p>광고 표현 점검 결과: <strong>경고 ${warnings.length}건</strong></p>${warnings.map(w=>`<div class="warning-item"><strong>${esc(w.term)}</strong> → 대체 제안: ${esc(w.suggestion)}</div>`).join("")}<p class="small-note">표현 점검은 참고용이며, 실제 광고 적합성은 제품 허가·신고 내용과 근거 자료를 확인해야 합니다.</p>`:`<p>광고 표현 점검 결과: 경고 0건</p><p class="small-note">제품 표시사항과 근거 자료를 최종 확인해 주세요.</p>`;
      showModal("광고 표현 점검 결과",content,action?"무시하고 진행":"닫기",action||null);
      if(!action)$("#modalContinue").classList.add("hidden");else $("#modalContinue").classList.remove("hidden");
    }
    function askExport(format){
      showWarnings(()=>exportDetail(format));
      $("#modalContinue").classList.remove("hidden");
    }
    async function exportDetail(format){
      if(typeof window.html2canvas!=="function"){alert("이미지 내보내기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return}
      let exportTarget;
      try{
        await document.fonts.ready;
        exportTarget=$("#detail").cloneNode(true);
        exportTarget.classList.add("exporting");
        Object.assign(exportTarget.style,{position:"fixed",left:"0",top:"0",transform:"none",zIndex:"-1",width:"860px",background:"#fff"});
        const hero=exportTarget.querySelector(".hero");
        if(hero)hero.style.setProperty("background",getComputedStyle(document.documentElement).getPropertyValue("--bg-soft"),"important");
        document.body.append(exportTarget);
        await Promise.all(Array.from(exportTarget.querySelectorAll("img")).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));
        const scale=state.highRes?2:1;
        const canvas=await html2canvas(exportTarget,{scale,backgroundColor:"#ffffff",useCORS:true,logging:false,width:860,windowWidth:860});
        const ext=format==="jpeg"?"jpg":"png";
        if(state.splitExport)downloadSlices(canvas,exportTarget,format,scale);
        else downloadCanvas(canvas,format,`${slug(state.productEn||state.productName)}_detail_${dateTag()}.${ext}`);
      }catch(err){console.error("이미지 내보내기 실패",err);alert("이미지 내보내기에 실패했습니다. 이미지 파일과 브라우저 메모리를 확인해 주세요.")}
      finally{exportTarget?.remove()}
    }
    function downloadCanvas(canvas,format,name){
      canvas.toBlob(blob=>{if(!blob){alert("이미지 파일을 만들지 못했습니다.");return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},format==="jpeg"?"image/jpeg":"image/png",.95)
    }
    function downloadSlices(canvas,detail,format,scale){
      const boundaries=Array.from(detail.querySelectorAll("[data-export-section]")).map(el=>Math.round((el.offsetTop+el.offsetHeight)*scale));
      const max=3000,segments=[];let start=0;
      while(start<canvas.height){
        let candidates=boundaries.filter(y=>y>start&&y-start<=max),end=candidates.length?Math.max(...candidates):Math.min(start+max,canvas.height);
        if(end<=start)end=Math.min(start+max,canvas.height);
        segments.push([start,end]);start=end;
      }
      segments.forEach(([y1,y2],i)=>{const slice=document.createElement("canvas");slice.width=canvas.width;slice.height=y2-y1;slice.getContext("2d").drawImage(canvas,0,y1,canvas.width,y2-y1,0,0,canvas.width,y2-y1);downloadCanvas(slice,format,`${slug(state.productEn||state.productName)}_detail_${dateTag()}_${String(i+1).padStart(2,"0")}.${format==="jpeg"?"jpg":"png"}`)})
    }
    async function copyHTML(){
      await document.fonts.ready;
      const style=document.querySelector("style").textContent;
      const html=`<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"><style>${style}</style><div style="width:860px;margin:0 auto;font-family:Pretendard,Arial,sans-serif;">${$("#detail").innerHTML}</div>`;
      try{await navigator.clipboard.writeText(html);alert("상세페이지 HTML을 복사했습니다.")}catch(e){console.error("HTML 복사 실패",e);alert("클립보드에 복사하지 못했습니다. 브라우저 권한을 확인해 주세요.")}
    }
    function loadExample(which){
      snapshot();state=defaultState();
      const presets={
        spatula:{type:"medical",productName:"멸균 목설압자",productEn:"Sterile Tongue Depressor",mainCopy:"개별 멸균 포장으로 위생적인 사용을 돕습니다.",specs:"개별포장 · 멸균제품 · 100개입",features:"개별 멸균 포장\\n목재 재질\\n의료기관 사용을 고려한 구성",target:"의료기관, 진료 및 검진 현장",noticeValues:{"품목명":"멸균 목설압자","모델명":"MD-TD-01","품목허가(신고)번호":"제품 표시사항 확인","등급":"제품 표시사항 확인","사용목적":"혀를 눌러 구강 내 상태를 확인하는 데 사용","사용방법":"사용 전 포장 상태를 확인하고 제품 표시사항에 따라 사용","포장단위":"100개입","멸균여부/방법":"멸균 제품 (방법은 포장 표시 확인)","제조원":"제조원 표기 확인","수입원":"해당 없음","제조국":"대한민국","사용기한":"포장에 별도 표기"}},
        bandage:{type:"quasi",productName:"하이드로콜로이드 밴드",productEn:"Hydrocolloid Dressing",mainCopy:"상처 부위를 보호하는 하이드로콜로이드 밴드",specs:"다양한 사이즈 · 개별 포장 · 간편 사용",features:"하이드로콜로이드 재질\\n상처 부위 보호용\\n제품 표시사항에 맞춰 사용",target:"가정에서 상처 보호용 제품을 찾는 분",noticeValues:{"제품명":"하이드로콜로이드 밴드","전성분":"제품 포장 및 표시사항 참조","규격":"상품 옵션별 상이","효능·효과":"제품 표시사항 확인","용법·용량":"사용 전 제품 표시사항 확인","저장방법":"직사광선을 피해 실온 보관","제조원":"포장 표시사항 참조","제조국":"포장 표시사항 참조","사용상 주의사항":"사용 전 제품 표시사항과 주의사항을 확인"}},
        castshoe:{type:"general",productName:"깁스용 캐스트슈즈",productEn:"Cast Shoe",mainCopy:"깁스와 함께 편안하게 착용하는 캐스트슈즈",specs:"사이즈 선택 · 좌우 겸용 · 간편 착용",features:"깁스 착용 시 사용할 수 있는 신발\\n사이즈 옵션 선택 가능\\n제품 구성은 옵션별 확인",target:"깁스 착용 중 신발이 필요한 분",noticeValues:{"제품명":"깁스용 캐스트슈즈","소재":"상품 상세 정보 참조","색상":"블랙","사이즈":"옵션별 상이","구성":"캐스트슈즈 1개","제조국":"상품 표시사항 참조","제조자/수입자":"상품 표시사항 참조","KC인증(해당 시)":"해당 없음"}}
      };
      const p=presets[which];state={...state,...p};state.noticeFields=types[state.type].fields.slice();state.sections=clone(baseSections);
      state.noticeValues={...state.noticeValues,...p.noticeValues};
      state.sections.find(s=>s.id==="hero").copy=state.mainCopy;
      state.sections.find(s=>s.id==="hero").iconLabels=which==="spatula"?["멸균","개별포장","일회용","병원용"]:which==="bandage"?["개별포장","흡수","휴대"]:["좌우겸용","쿠션","가정용"];
      const solution=section("solution");solution.titleText=which==="spatula"?"개별 포장으로 위생적인 사용을 고려했습니다.":which==="bandage"?"상처 보호가 필요한 순간을 위한 선택.":"깁스 착용에 맞춘 편안한 신발.";
      section("compare").enabled=false;
      renderAll()
    }
    function aiPrompt(sectionName){
      return `당신은 한국 의료용품 상세페이지의 문구 작성 도우미입니다. 아래 광고 표현 가이드를 반드시 준수하세요.\n광고 표현 가이드: 의료기기법·약사법·표시광고법에 맞춰 허가·신고된 사용목적과 확인된 사실만 표현합니다. 완치, 치료, 특효, 만병통치, 100% 효과, 부작용 없음, 의사 추천, 식약처 인증(근거 없을 때), 최고, 최초, 유일, 1위(근거 없을 때), 즉각, 영구적, 재발 방지 등 단정·과장 표현을 쓰지 않습니다. 일반 건강용품은 통증 완화, 혈액순환, 교정 등 의료 효능을 표현하지 않습니다. 의료기기는 허가받은 사용목적 범위에서만 작성하고, 근거가 없는 수치·인증·효능을 만들지 않습니다.\n문체: 짧고 또렷한 존댓말, 한 문장 30자 이내, 사실 위주. 확인되지 않은 정보는 새로 만들지 말고 보수적으로 작성하세요.\n제품 유형: ${types[state.type].label}\n제품명: ${state.productName}\n핵심 특징: ${state.features}\n타깃 고객: ${state.target}\n요청: ${sectionName}\nJSON 형식만 출력하고 다른 설명은 하지 마세요.`;
    }
    async function callAI(prompt){
      if(!state.apiKey){alert("AI 문구 작성은 설정에 Anthropic API 키를 입력한 뒤 사용할 수 있습니다.");return null}
      try{
        const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":state.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:state.aiModel||"claude-sonnet-5-5",max_tokens:2500,system:"요청에 맞는 한국어 상세페이지 문구를 JSON으로 작성하세요.",messages:[{role:"user",content:prompt}]})});
        if(!response.ok)throw new Error(`API 오류 (${response.status}): ${await response.text()}`);
        const data=await response.json(),text=(data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
        return JSON.parse(text.replace(/^```(?:json)?\s*/,"").replace(/\s*```$/,""));
      }catch(e){console.error("AI 문구 작성 실패",e);alert("AI 문구를 작성하지 못했습니다: "+e.message);return null}
    }
    async function writeSection(id){
      if(!state.apiKey){alert("AI 문구 작성은 설정에 Anthropic API 키를 입력한 뒤 사용할 수 있습니다.");return}
      const result=await callAI(aiPrompt(`${id} 섹션 문구를 작성하세요. 객체 JSON으로 반환: title, description, items 배열(각 원소 title, description).`));
      if(!result)return;snapshot();
      if(id==="hero"){section("hero").copy=result.description||result.title||""}
      else if(id==="empathy"){section("empathy").cards=(result.items||[]).slice(0,6).map(x=>({title:x.title||"",desc:x.description||"",image:""}))}
      else if(id==="points"){section("points").items=(result.items||[]).slice(0,8).map(x=>({headline:x.title||"",desc:x.description||"",image:"",layout:"A"}))}
      else if(id==="steps"){section("steps").items=(result.items||[]).slice(0,6).map(x=>({title:x.title||"",desc:x.description||"",image:""}))}
      else if(id==="recommend"||id==="caution"){section(id).items=(result.items||[]).map(x=>typeof x==="string"?x:x.description||x.title||"").slice(0,6)}
      renderAll()
    }
    async function writeAllAi(){
      const prompt=aiPrompt("전체 상세페이지 문구 작성. JSON 스키마: {heroCopy:string, empathy:[{title,description}], points:[{title,description}], steps:[{title,description}], recommendations:[string], cautions:[string]}. 공감 4개, 특장점 3~5개, 사용법 3개, 추천 3~6개, 주의사항 3개 작성.");
      const result=await callAI(prompt);if(!result)return;snapshot();
      section("hero").copy=result.heroCopy||"";
      section("empathy").cards=(result.empathy||[]).slice(0,6).map(x=>({title:x.title||"",desc:x.description||"",image:""}));
      section("points").items=(result.points||[]).slice(0,8).map(x=>({headline:x.title||"",desc:x.description||"",image:"",layout:"A"}));
      section("steps").items=(result.steps||[]).slice(0,6).map(x=>({title:x.title||"",desc:x.description||"",image:""}));
      section("recommend").items=(result.recommendations||[]).slice(0,6);
      section("caution").items=(result.cautions||[]).slice(0,6);
      renderAll()
    }
    loadLocal();bindBase();renderAll();
  })();
  </script>
